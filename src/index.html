    <script>
      // Apply the saved theme before the first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem('cvgen.theme');
          var dark =
            saved === 'dark' ||
            (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {
          /* ignore */
        }
      })();
    </script>

        <p>Características: 16 plantillas, 24 paletas de color, foto opcional, analizador de ofertas de empleo, deshacer/rehacer, autoguardado y exportación a Word, PDF, Markdown y JSON.</p>
