<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>CV Generador — currículums claros con tu propio estilo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Editor de currículums con 7 perfiles, 16 plantillas, 24 paletas, foto opcional y exportación a Word, PDF y Markdown. Todo ocurre en tu navegador."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="logo-cv-generador.png" />
    <script>
      // Apply the saved theme before the first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem('cvgen.theme');
          var dark =
            saved === 'dark' ||
            (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
